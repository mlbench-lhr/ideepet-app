name: Deploy to Play Store

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # IMPORTANT: Fetch all history to get tags

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Disable Telemetry
        run: flutter --disable-analytics

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Update pubspec.yaml Version
        id: update-version
        run: |
          echo "Fetching latest tag matching 'vX.Y.Z'..."
          # Get the latest tag matching vX.Y.Z, default to v0.0.0 if none exists
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "v0.0.0")
          echo "Latest tag found: $LATEST_TAG"

          # Remove the 'v' prefix to get the semantic version
          LATEST_VERSION=${LATEST_TAG#v}
          echo "Version from tag: $LATEST_VERSION"

          # Split version into parts
          IFS='.' read -r -a VERSION_PARTS <<< "$LATEST_VERSION"

          # Basic validation
          if [ ${#VERSION_PARTS[@]} -ne 3 ]; then
            echo "Error: Could not parse version parts from tag '$LATEST_VERSION'"
            exit 1
          fi

          # Increment the patch version
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          NEW_SEMVER="${MAJOR}.${MINOR}.${PATCH}"
          echo "Incremented semantic version: $NEW_SEMVER"

          # Get the build number
          BUILD_NUM=${{ github.run_number }}
          echo "Build number: $BUILD_NUM"

          # Construct the full version string for pubspec.yaml
          NEW_PUBSPEC_VERSION="${NEW_SEMVER}+${BUILD_NUM}"
          echo "New pubspec version string: $NEW_PUBSPEC_VERSION"

          # Update pubspec.yaml using sed to replace the entire version line
          # This is more robust than replacing a fixed placeholder
          # -E enables extended regex, ^version: matches the start of the line
          # .* matches the rest of the line
          sed -i -E "s/^version:.*/version: ${NEW_PUBSPEC_VERSION}/" pubspec.yaml

          echo "Verifying pubspec.yaml update:"
          grep "^version:" pubspec.yaml

          # Set outputs for potential use in later steps
          echo "tag_version=$NEW_SEMVER" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUM" >> $GITHUB_OUTPUT

      - name: Build App Bundle
        run: flutter build appbundle --release

      # --- Assinatura and Upload (rest of your workflow remains the same) ---
      - name: Sign App Bundle
        run: |
          set -e
          echo "$PLAY_STORE_UPLOAD_KEY" | base64 -d > upload-keystore.jks
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 \
            -keystore upload-keystore.jks \
            -storepass "$PLAY_STORE_KEYSTORE_PASSWORD" \
            -keypass "$PLAY_STORE_KEY_PASSWORD" \
            build/app/outputs/bundle/release/app-release.aab upload
          rm upload-keystore.jks

      - name: Create service_account.json
        run: echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Deploy to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service_account.json
          packageName: com.tarzia.idee_pet
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal

    env:
      PLAY_STORE_UPLOAD_KEY: ${{ secrets.PLAY_STORE_UPLOAD_KEY }}
      PLAY_STORE_KEYSTORE_PASSWORD: ${{ secrets.PLAY_STORE_KEYSTORE_PASSWORD }}
      PLAY_STORE_KEY_PASSWORD: ${{ secrets.PLAY_STORE_KEY_PASSWORD }}
      GITHUB_RUN_NUMBER: ${{ github.run_number }}