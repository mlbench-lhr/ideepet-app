org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Several plugins (tflite_flutter, firebase_analytics, etc.) each pin their own Java/Kotlin
# compile targets, which trips Kotlin Gradle Plugin's strict JVM-target validation across
# independent library modules. The mismatch is harmless at the dex level, so relax it to a
# warning instead of a hard failure. https://kotl.in/gradle/jvm/target-validation
kotlin.jvm.target.validation.mode=warning
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
